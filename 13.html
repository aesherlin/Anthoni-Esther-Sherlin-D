<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Page</title>

    <style>
        .container{
            column-gap: 5px;
            row-gap: 5px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            height: 100px;
        }
        .flex-container{
            column-gap: 10px;
        }   
        @media(max-width:500px) {/* responsive web Design Media Query */} 
         .flex-container{
            display: flex;
            flex-direction: row;
            height: 100px;
            column-gap: 10px;
        }
        #div1{
            color: aqua;
            font-size: 35px;
            font-family: 'Courier New';
            padding : 30px;
            margin: 50px;
            height: 200px;
            width: 250px;
            background-color: wheat;
            border: 2px solid black;
            border-radius: 5px;
            float: left;
        }
        
    </style>
</head>
<body>
    <div class="flex-container">
        <div style="flex: 1;background-color: bisque;">div1</div>
        <div style="flex: 2;background-color: rgb(232, 154, 59);">div2</div>
        <div style="flex: 3;background-color: rgb(119, 69, 7);">div3</div>
        <div style="flex: 4;background-color: beige;">div4</div>
    </div>
</body>
</html>
