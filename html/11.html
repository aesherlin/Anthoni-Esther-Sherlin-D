<!DOCTYPE html>
<html lang="en">
<head>
    <title>Web page</title>
    <style>
        .two{
            color: aqua;
            font-size: 35px;
            font-family: 'Courier New';
        }
        span{
            color: crimson;
            font-family: 'Times New Roman';
            font-size: 40px;
        }

        #one{
            color: aquamarine;
        }
        div{
            color: aqua;
            font-size: 35px;
            font-family: 'Courier New';
            padding: 30px;
            margin: 50px;
            height: 200px;
            width: 250px;
            background-color: wheat;
            border: 2px solid black;
            border-radius: 5px;
            float: left;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div.border{
            opacity: 0.5px;
        }
        img{
            width: 100%;
            height: 100%;
        }
       
    </style>
</head>
<body>
    
    <div style="color: blueviolet;">hello</div>
    <div>world</div>
    <div class="two">GOOD</div>
    <div id="one">Bad</div>
    <span>Loyola</span>
    <div><img src="Greninja.jpg"></div>
    
</body>
</html>
